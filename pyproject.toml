[project]
name = "ew-smart-scan"
version = "0.1.0"
description = "EW Smart Scan Strategy — SIH 2026, PS 26055 (DRDO)"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "h5py==3.11.0",
    # NOTE: torch is NOT listed here — install it separately (CPU-only):
    #   pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
    # See requirements-torch.txt for the pinned version.
    #
    # NOTE: turing-deinterleaving-challenge is a git-only package — install with:
    #   pip install git+https://github.com/alan-turing-institute/turing-deinterleaving-challenge.git
    # Do NOT add it here because pip cannot resolve git-only packages as pinned deps.
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.112.2",
    "pytest==8.2.2",
    "matplotlib==3.9.1",
    "streamlit>=1.30",
    "plotly>=5.0",
]
# Install for downloading TSRD data from HuggingFace Hub:
#   pip install "ew-smart-scan[data]"
data = [
    "huggingface_hub==0.24.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
